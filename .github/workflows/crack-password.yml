name: Password Cracker

on:
  workflow_dispatch:
    inputs:
      target_url:
        description: 'Target URL to crack'
        required: true
        default: 'https://blyciallo.com/posts/wo-de-mi-mi/'
      slug:
        description: 'Article slug'
        required: true
        default: 'wo-de-mi-mi'
      wordlist_url:
        description: 'Custom wordlist URL (optional, e.g. raw github or text file)'
        required: false
        default: ''

jobs:
  crack:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Download wordlist
        if: inputs.wordlist_url != ''
        run: |
          curl -sL "${{ inputs.wordlist_url }}" -o wordlist.txt
          echo "Downloaded $(wc -l < wordlist.txt) words"

      - name: Crack password
        env:
          TARGET_URL: ${{ github.event.inputs.target_url }}
          SLUG: ${{ github.event.inputs.slug }}
          CUSTOM_WORDLIST: ${{ inputs.wordlist_url }}
        run: |
          node scripts/crack-password.js
