name: Build and Deploy to VPS

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# 同一时间只允许一个部署任务，避免两次发布交叉覆盖
concurrency:
  group: deploy-vps
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_PORT: ${{ secrets.VPS_PORT || '22' }}
      VPS_PATH: ${{ secrets.VPS_PATH }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build site
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm run build

      # 私钥存为 GitHub Secret: VPS_SSH_KEY
      - name: Setup SSH key
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          eval "$(ssh-agent -s)"
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-add ~/.ssh/id_ed25519

      - name: Trust VPS host key
        run: |
          ssh-keyscan -p "$VPS_PORT" -H "$VPS_HOST" >> ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      # 直接把 dist/ 同步到站点根目录（宝塔的 root 就指向这里）。
      # --delete 会清掉上一次构建的残留文件，保证目录内容与 dist/ 完全一致。
      - name: Upload dist/ to site root
        run: |
          rsync -avz --delete \
            -e "ssh -p $VPS_PORT -o StrictHostKeyChecking=yes" \
            dist/ \
            "$VPS_USER@$VPS_HOST:$VPS_PATH/"

      - name: Done
        run: echo "Deployed to $VPS_HOST:$VPS_PATH"
