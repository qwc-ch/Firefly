name: 📥 同步B站动态

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:
    inputs:
      max_pages:
        description: 最大翻页数（首次可设大点拉历史）
        required: false
        default: '3'
        type: number

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.repository.default_branch }}

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install Playwright
        run: |
          mkdir -p /tmp/pw
          cd /tmp/pw
          npm init -y
          npm install playwright
          npx playwright install --with-deps chromium
          echo "NODE_PATH=/tmp/pw/node_modules" >> "$GITHUB_ENV"

      - name: Sync Bilibili Dynamics
        run: node .github/scripts/sync-bilibili-dynamics.cjs
        env:
          BILIBILI_UID: '3546591015209640'
          FILTER_KEYWORDS: '投票,抽奖'
          MAX_PAGES: ${{ inputs.max_pages || '3' }}
