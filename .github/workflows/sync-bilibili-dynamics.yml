name: 📥 同步B站动态

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:
    inputs:
      max_pages:
        description: 最大翻页数（首次设大点拉历史）
        required: false
        default: '20'
        type: number

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.repository.default_branch }}

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Sync Bilibili Dynamics
        run: node .github/scripts/sync-bilibili-dynamics.cjs
        env:
          BILIBILI_UID: '3546591015209640'
          FILTER_KEYWORDS: '投票,抽奖'
          MAX_PAGES: ${{ inputs.max_pages || '5' }}
